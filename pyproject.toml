[project]
name = "app"          # CHANGE: your project name
version = "0.1.0"
description = ""      # CHANGE: short description
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Dependency injection
    "dishka>=1.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # Validation
    "pydantic>=2.7.0",

    # Messaging
    "aiokafka>=0.11.0",

    # Cache / sessions
    "redis>=5.0.4",

    # Object storage
    "boto3>=1.34.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",

    # Config
    "pyyaml>=6.0.1",

    # Logging
    "structlog>=24.2.0",

    # HTTP client (inter-service calls)
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # function calls in default args (FastAPI Depends)

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["backend/migrations/", "backend/tests/"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/migrations/*", "backend/app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70  # CHANGE: adjust minimum coverage threshold
