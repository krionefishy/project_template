# Test configuration — used by pytest
# DATABASE_URL env var overrides database.url (for CI / parallel workers)

environment: test
log_level: WARNING

app:
  service_name: "app-test"

database:
  url: "postgresql+asyncpg://user:password@localhost:5432/app_test_db"
  echo: false

redis:
  host: "localhost"
  port: 6379
  password: null
  db: 1

kafka:
  bootstrap_servers: "localhost:9092"
  consumer_group: "app-test-group"
  max_request_size: 10485760

s3:
  endpoint_url: "https://storage.yandexcloud.net"
  key_id: ""
  secret_key: ""
  bucket_name: "test-bucket"
  region: "ru-central-1"
  tenant_id: ""
  verify: true
  # S3 is mocked in tests via MockS3Client — these values are not used

jwt:
  secret: "test-secret-key-do-not-use-in-production"
  algorithm: "HS256"
  access_expire_seconds: 3600
  refresh_expire_seconds: 604800
  rsa_private_key_pem: null

rsa:
  enabled: false
  private_key_path: "tests/fixtures/keys/private.pem"
