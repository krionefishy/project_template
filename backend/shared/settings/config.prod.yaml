app:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  log_level: "INFO"
  service_name: "my-service"
  docs_enabled: false

database:
  url: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
  echo: false

redis:
  host: "redis"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0

kafka:
  bootstrap_servers: "kafka:9092"
  consumer_group: "app-group"
  max_request_size: 10485760

s3:
  endpoint_url: "${S3_ENDPOINT_URL}"
  key_id: "${S3_KEY_ID}"
  secret_key: "${S3_SECRET_KEY}"
  bucket_name: "${S3_BUCKET_NAME}"
  region: "${S3_REGION}"
  tenant_id: "${S3_TENANT_ID}"
  verify: true

jwt:
  secret_key: "${JWT_SECRET}"
  algorithm: "HS256"
  access_token_expire_minutes: 15
  refresh_token_expire_days: 30
  rsa_private_key_pem: "${RSA_PRIVATE_KEY_PEM}"

rsa:
  enabled: true
  private_key_path: "/app/keys/private.pem"
