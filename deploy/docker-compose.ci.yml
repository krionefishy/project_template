# CI-only PostgreSQL
# Kafka, S3, Redis are mocked in tests — not started here

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test_db"]
      interval: 3s
      timeout: 5s
      retries: 10
