# ============================================================
# Nginx virtual host — internal routing
#
# Routes:
#   /api/v1/  → backend:8000   (FastAPI)
#   /         → frontend:80    (React SPA, if applicable)
#
# CHANGE: update server_name to your actual domain
# CHANGE: add ssl_certificate / ssl_certificate_key for HTTPS
# ============================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

# CHANGE: if you have a frontend service
# upstream frontend {
#     server frontend:80;
#     keepalive 16;
# }

server {
    listen 80;
    server_name example.com www.example.com;  # CHANGE: your domain

    # --- Uncomment for HTTPS ---
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;

    # --- API proxy ---
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;  # CHANGE: increase for long-running endpoints
        proxy_send_timeout    60s;

        # File upload support
        client_max_body_size 100m;  # CHANGE: match Dockerfile / usecase limits
    }

    # --- Frontend (uncomment if serving SPA) ---
    # location / {
    #     proxy_pass http://frontend;
    #     proxy_set_header Host $host;
    # }

    # --- Static health check ---
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
